<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital@0;1&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="lista">
        <header>
            <img src="./imagem/—Pngtree—to do list sticker 3d_17462151.png" alt="Lista de tarefas">
            <h1>Lista de Tarefas</h1>
        </header>

        <form>
            <h2>Inserir nova tarefa</h2>
            <input type="text" id="add-tarefa" required placeholder="Nome da tarefa">
            <button type="submit" class="botoes">Cadastrar</button>
            <button type="reset" class="botao-cancelar">Cancelar</button>
        </form>
        
        <ul id="lista-tarefas"></ul>
        
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <script src="./script.js"></script>
    </div>
</body>
</html>
